<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ .Title }} — {{ .Site.Title }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #bg-video {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    #click-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      cursor: default;
    }
  </style>
</head>
<body>

  <div id="stage">
    <video id="bg-video" autoplay loop playsinline>
      <source src="{{ .Params.video | default "/video/loop.mp4" }}" type="video/mp4" />
    </video>
  </div>

  <div id="click-layer"></div>

  <script>
    // Capture language before any URL mutations
    const langMatch = window.location.pathname.match(/^\/(en|sv)\//);
    const lang = langMatch ? langMatch[1] : 'en';

    function redirectBack() {
      const base = '/' + lang + '/miscellaneous/';
      // Store lang in localStorage so popup fires even after tab-close mid-trap
      try { localStorage.setItem('roots_virus_escaped', lang); } catch(e) {}
      window.location.href = base + '?escaped=' + lang;
    }

    let attempts = 0;
    const TOTAL  = 3;
    let free     = false;

    history.pushState(null, '', window.location.href);
    history.pushState(null, '', window.location.href);

    function handleAttempt() {
      if (free) {
        redirectBack();
        return;
      }

      attempts++;
      history.pushState(null, '', '/lost/');
      history.pushState(null, '', '/lost/');

      if (attempts >= TOTAL) {
        free = true;
        window.onbeforeunload = null;
      }
    }

    document.getElementById('click-layer').addEventListener('click', handleAttempt);

    window.addEventListener('popstate', function() {
      handleAttempt();
    });

    window.addEventListener('beforeunload', function(e) {
      if (!free) {
        // Set localStorage flag so the popup fires on next visit
        // even if they close the tab right now
        try { localStorage.setItem('roots_virus_escaped', lang); } catch(e) {}
        e.preventDefault();
        e.returnValue = '';
      }
    });
  </script>

</body>
</html>
