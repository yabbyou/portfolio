<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ .Title }} — {{ .Site.Title }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #bg-video {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    #click-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      cursor: default;
    }
  </style>
</head>
<body>

  <div id="stage">
    <video id="bg-video" autoplay loop playsinline>
      <source src="{{ .Params.video | default "/video/loop.mp4" }}" type="video/mp4" />
    </video>
  </div>

  <div id="click-layer"></div>

  <script>
    // Capture language before any URL mutations
    const langMatch = window.location.pathname.match(/^\/(en|sv)\//);
    const lang = langMatch ? langMatch[1] : null;

    function getBackURL() {
      const base = lang ? '/' + lang + '/miscellaneous/' : '/miscellaneous/';
      return base + '?escaped=1';
    }

    let attempts = 0;
    const TOTAL  = 3;
    let free     = false;

    // Push TWO dummy entries so the back button has buffer to pop
    // before actually leaving. Each popstate we re-push one to keep
    // the stack topped up — the user can never actually go back.
    history.pushState(null, '', window.location.href);
    history.pushState(null, '', window.location.href);

    function handleAttempt() {
      if (free) {
        window.location.href = getBackURL();
        return;
      }

      attempts++;
      history.pushState(null, '', '/lost/');
      history.pushState(null, '', '/lost/'); // keep stack deep so back never escapes

      if (attempts >= TOTAL) {
        free = true;
        window.onbeforeunload = null;
      }
    }

    document.getElementById('click-layer').addEventListener('click', handleAttempt);

    // Back button / swipe — counts as an attempt regardless of phase
    window.addEventListener('popstate', function() {
      handleAttempt();
    });

    window.addEventListener('beforeunload', function(e) {
      if (!free) {
        e.preventDefault();
        e.returnValue = '';
      }
    });
  </script>

</body>
</html>
