{{ define "main" }}

<article class="post-single home">

  {{ $parts := split .RawContent "<!-- BODY SPLIT MARKER -->" }}

  <!-- HERO -->
  {{ index $parts 0 | markdownify }}

  <!-- BODY -->
  <section class="post-content">
    {{ index $parts 1 | markdownify }}
  </section>

</article>

<script>
  // Roots_virus trap popup — fires on homepage if localStorage flag is set
  (function() {
    var stored;
    try { stored = localStorage.getItem('roots_virus_escaped'); } catch(e) {}
    if (!stored) return;

    // Detect lang from URL — homepage may be / with no prefix,
    // so fall back to browser language
    var pageLang = window.location.pathname.match(/^\/(en|sv)\//);
    var lang = pageLang ? pageLang[1]
             : (navigator.language || navigator.userLanguage || 'en').startsWith('sv') ? 'sv'
             : 'en';

    var strings = {
      en: { msg: "Something's going around", btn: 'Mi hear yuh' },
      sv: { msg: 'Det är nån skit som går',  btn: 'Mi hear yuh' }
    };

    setTimeout(function() {
      var s = strings[lang] || strings.en;
      document.getElementById('escaped-msg').textContent = s.msg;
      document.getElementById('escaped-btn').textContent = s.btn;
      document.getElementById('escaped-overlay').classList.add('active');
      document.getElementById('escaped-dialog').classList.add('active');
    }, 1000);
  })();
</script>

{{ end }}
