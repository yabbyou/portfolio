{{ define "main" }}

<article class="post-single home">

  {{ $parts := split .RawContent "<!-- BODY SPLIT MARKER -->" }}

  <!-- HERO -->
  {{ index $parts 0 | markdownify }}

  <!-- BODY -->
  <section class="post-content">
    {{ index $parts 1 | markdownify }}
  </section>

</article>

<script>
  // Homepage-specific trigger: extend_footer.html already injected the dialog
  // elements and showEscapedDialog() — just fire it if the flag is set.
  (function() {
    var stored;
    try { stored = localStorage.getItem('roots_virus_escaped'); } catch(e) {}
    if (!stored) return;
    setTimeout(function() { showEscapedDialog(); }, 1000);
  })();
</script>

{{ end }}
