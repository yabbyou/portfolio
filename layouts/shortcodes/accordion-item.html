{{ $title := .Get "title" | default "Accordion Item" }}
{{ $type := $.Page.Scratch.Get "accordionType" | default "default" }}
{{ $open := .Get "open" }}

<div class="accordion-item">
  <button aria-expanded="{{ if eq $open "true" }}true{{ else }}false{{ end }}">
    <span class="accordion-title">{{ $title }}</span>
    <span class="icon" aria-hidden="true"></span>
  </button>

  <div class="accordion-content">
    {{ .Inner | markdownify }}
  </div>
</div>
