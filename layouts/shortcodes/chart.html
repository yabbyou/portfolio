<canvas id="{{ .Get "id" }}"></canvas>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const ctx = document.getElementById('{{ .Get "id" }}');

  new Chart(ctx, {
    type: '{{ .Get "type" }}',
    data: {
      labels: ['2020', '2021', '2022', '2023'],
      datasets: [{
        label: 'Example',
        data: [10, 20, 15, 30]
      }]
    }
  });
});
</script>
